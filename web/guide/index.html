<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FDS 가이드 · 처음부터 끝까지 따라가는 프로젝트</title>
<meta name="description" content="기업가치 훼손위험 탐지 프로젝트를 실제 데이터로 처음부터 끝까지 따라가며 이해하는 안내 사이트">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/guide/style.css">
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <a class="logo" href="#/" aria-label="FDS 가이드 홈"><span class="logo-mark">FDS</span><span class="logo-sub">가이드</span></a>
    <nav class="nav" id="nav" aria-label="주요 메뉴">
      <a href="#/" data-r="home">큰 그림</a>
      <a href="#/data" data-r="data">데이터</a>
      <a href="#/models" data-r="models">모델</a>
      <a href="#/case" data-r="case">따라가기</a>
      <a href="#/status" data-r="status">현황</a>
    </nav>
    <div class="top-tools">
      <span class="fresh" id="fresh" title="가이드 데이터 생성 시각"></span>
      <button class="find-btn" id="findBtn" type="button" aria-label="찾아보기 열기"><span>찾아보기</span><kbd>Ctrl K</kbd></button>
    </div>
  </div>
  <div class="progress" id="progress"></div>
</header>
<main id="view" tabindex="-1"><div class="boot">불러오는 중…</div></main>
<footer class="foot">
  <div class="foot-in">
    <p>점수 경계와 r=8.5%는 검증 전 가설이다. 투자 판단의 근거가 아니다.</p>
    <p class="mono" id="footMeta"></p>
  </div>
</footer>

<div class="drawer-wrap" id="finder" hidden>
  <div class="drawer-bg" data-close></div>
  <div class="drawer" role="dialog" aria-modal="true" aria-label="찾아보기">
    <div class="drawer-head">
      <input id="findInput" type="search" placeholder="용어, 파일, 단계 검색" autocomplete="off">
      <button class="x" data-close type="button" aria-label="닫기">닫기</button>
    </div>
    <div class="drawer-body" id="findOut"></div>
  </div>
</div>
<div class="drawer-wrap" id="filer" hidden>
  <div class="drawer-bg" data-close></div>
  <div class="drawer side" role="dialog" aria-modal="true" aria-label="파일 상세">
    <div class="drawer-body" id="filerBody"></div>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<script src="/guide/core.js"></script>
<script src="/guide/pages.js"></script>
</body>
</html>
